<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found | Sohan Gurung</title>

    <!-- Using system fonts for a fast, clean, modern dev look -->
    <style>
        :root {
            --bg-color: #0d1117;       /* Dark GitHub-style background */
            --text-main: #c9d1d9;      /* Light gray text */
            --text-muted: #8b949e;     /* Muted gray for secondary text */
            --accent: #58a6ff;         /* Modern tech blue */
            --accent-hover: #3182ce;   /* Slightly darker blue for hover */
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        .container {
            max-width: 600px;
            padding: 2rem;
            animation: fadeIn 0.5s ease-out;
        }

        .error-code {
            font-size: 8rem;
            font-weight: 800;
            margin: 0;
            line-height: 1;
            background: linear-gradient(135deg, #58a6ff, #bc8cff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: float 3s ease-in-out infinite;
        }

        .error-title {
            font-size: 1.8rem;
            font-weight: 600;
            margin-top: 1rem;
            margin-bottom: 0.5rem;
            color: #ffffff;
        }

        .error-msg {
            color: var(--text-muted);
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 2.5rem;
        }

        /* Developer-style inline code block */
        .code-snippet {
            background-color: rgba(110, 118, 129, 0.1);
            border: 1px solid rgba(110, 118, 129, 0.2);
            border-radius: 6px;
            padding: 0.2rem 0.5rem;
            font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
            font-size: 0.9rem;
            color: #e6edf3;
        }

        .btn {
            display: inline-block;
            padding: 0.8rem 1.8rem;
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
            background-color: var(--accent);
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(88, 166, 255, 0.2);
        }

        .btn:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(88, 166, 255, 0.4);
        }

        /* Subtle animations */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <h1 class="error-code">404</h1>
    <h2 class="error-title">Route Not Found</h2>
    <p class="error-msg">
        Looks like you tried to access an endpoint that doesn't exist. <br>

    </p>

    <a href="/" class="btn">cd ~/home</a>
</div>

</body>
</html>
